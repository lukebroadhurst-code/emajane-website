# Staging: every push to main publishes the site/ folder to GitHub Pages.
# GitHub Pages is static, so the admin runs in demo mode here (see site/site.config.js).
name: Deploy staging to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Browsers may keep a file for ten minutes. Giving each release its own file addresses means a visitor never gets a mix of new and old files.
      - name: Stamp this release on every file address
        run: node tools/stamp.mjs "${GITHUB_SHA::8}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
